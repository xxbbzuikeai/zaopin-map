<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>后台 · 在招厂区位置地图</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:13px/1.6 "Microsoft YaHei",system-ui,sans-serif;background:#eef1f5;color:#1f2933}
header{height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#1b2430;color:#fff}
header .t{font-size:16px;font-weight:700}
header .sp{flex:1 1 auto}
header a{color:#9db2c8;text-decoration:none;font-size:12.5px}
header a:hover{color:#fff}
header button{border:1px solid #3a4b60;background:#2c3a4b;color:#dbe6f2;border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit;font-size:12.5px}
main{max-width:1180px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid #e1e7ee;border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.card h2 .n{font-weight:400;color:#8a97a6;font-size:12px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1 1 130px;background:#f7f9fb;border:1px solid #e6ebf1;border-radius:9px;padding:9px 12px}
.stat .k{font-size:11.5px;color:#7b8896}
.stat .v{font-size:22px;font-weight:700;margin-top:2px}
.stat.on .v{color:#2b8a4a}
.stat.pen .v{color:#b0772a}
.stat.rvk .v{color:#b02a2a}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid #eef1f5;font-size:12.5px;vertical-align:middle}
th{color:#7b8896;font-weight:600;font-size:12px;background:#fafbfd}
tr.pending{background:#fff9ee}
tr.revoked td{color:#98a4b1}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#c3ccd6;margin-right:5px;vertical-align:1px}
.dot.on{background:#2fbf62;box-shadow:0 0 0 3px rgba(47,191,98,.18)}
.badge{display:inline-block;font-size:11px;border-radius:10px;padding:1px 8px;border:1px solid #dfe6ee;color:#5b6b7d;background:#f7f9fb}
.badge.active{color:#2b8a4a;background:#e9f8ee;border-color:#b7e4c7}
.badge.pending{color:#b0772a;background:#fff6e6;border-color:#ffe0a8}
.badge.revoked{color:#b02a2a;background:#fdeaea;border-color:#f5c2c2}
.badge.admin{color:#0b4f9e;background:#e7f1fd;border-color:#cfe2f8}
.ops{display:flex;flex-wrap:wrap;gap:5px}
.ops button{border:1px solid #d5dde7;background:#fff;color:#41546a;border-radius:6px;padding:2px 8px;cursor:pointer;font:inherit;font-size:11.5px}
.ops button:hover{border-color:#1c7ed6;color:#1c7ed6}
.ops button.danger:hover{border-color:#c92a2a;color:#c92a2a}
.ops button.good:hover{border-color:#2b8a4a;color:#2b8a4a}
form.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
form.row input,form.row select{height:30px;border:1px solid #d5dde7;border-radius:6px;padding:0 8px;font:inherit;font-size:12.5px}
form.row button{height:30px;border:none;border-radius:6px;background:#1c7ed6;color:#fff;padding:0 12px;cursor:pointer;font:inherit;font-size:12.5px}
.logs{max-height:260px;overflow:auto;font-size:12px;color:#526478}
.logs div{padding:3px 0;border-bottom:1px dashed #eef1f5}
.logs .k{color:#1c7ed6}
.small{font-size:11.5px;color:#8a97a6}
#loginBox{max-width:320px;margin:12vh auto;background:#fff;border:1px solid #e1e7ee;border-radius:12px;padding:22px}
#loginBox h2{margin:0 0 12px;font-size:15px}
#loginBox input{width:100%;height:34px;margin-bottom:8px;border:1px solid #d5dde7;border-radius:6px;padding:0 10px;font:inherit}
#loginBox button{width:100%;height:34px;border:none;border-radius:6px;background:#1c7ed6;color:#fff;cursor:pointer;font:inherit}
#loginMsg{color:#c92a2a;font-size:12px;min-height:18px;margin-top:6px}
</style>
<script>window.DP1_API_BASE='https://inappropriate-swan-d8c59977a1019-1514742363.ap-shanghai.app.tcloudbase.com';</script>
</head>
<body>
<header>
  <div class="t">后台管理 · 在招厂区位置地图</div>
  <span class="small" style="color:#7b8ea5" id="srvTime"></span>
  <div class="sp"></div>
  <a href="/">← 回前台</a>
  <a href="#" id="logoutBtn">退出</a>
</header>
<main id="main" style="display:none">
  <div class="card">
    <h2>概览 <span class="n" id="statsHint"></span></h2>
    <div class="stats" id="stats"></div>
  </div>

  <div class="card" id="pendingCard" style="display:none">
    <h2>等待审核 <span class="n" id="pendingN"></span></h2>
    <table><thead><tr><th>用户名</th><th>注册时间</th><th>IP</th><th>操作</th></tr></thead>
      <tbody id="pendingBody"></tbody></table>
  </div>

  <div class="card">
    <h2>用户 <span class="n" id="usersN"></span></h2>
    <table>
      <thead><tr><th>用户名</th><th>状态</th><th>角色</th><th>在线</th><th>最近活动</th><th>最近登录</th><th>IP</th><th>操作</th></tr></thead>
      <tbody id="userBody"></tbody>
    </table>
    <div class="small" style="margin-top:8px">「在线」＝ 前台 90 秒内有心跳；封禁会立刻踢下线，下一次刷新就进不去。</div>
  </div>

  <div class="card">
    <h2>建号 / 设置</h2>
    <form class="row" id="createForm">
      <input id="cUser" placeholder="用户名" autocomplete="off">
      <input id="cPw" placeholder="密码（留空自动生成）" autocomplete="off">
      <select id="cRole"><option value="viewer">查看者</option><option value="admin">管理员</option></select>
      <button type="submit">创建账号</button>
      <span class="small" id="createMsg"></span>
    </form>
    <div class="row" style="margin-top:10px;display:flex;gap:8px;align-items:center">
      <label class="small" style="display:flex;gap:6px;align-items:center;cursor:pointer">
        <input type="checkbox" id="allowReg"> 允许访客自助注册（注册后需审核）
      </label>
    </div>
  </div>

  <div class="card">
    <h2>最近事件</h2>
    <div class="logs" id="logs"></div>
  </div>
</main>

<div id="loginBox" style="display:none">
  <h2>管理员登录</h2>
  <input id="lu" placeholder="管理员账号" autocomplete="username" value="3224392326">
  <input id="lp" type="password" placeholder="密码" autocomplete="current-password">
  <button id="lbtn">登录后台</button>
  <div id="loginMsg"></div>
  <div class="small" style="margin-top:8px">初始管理员密码见 <code>trial\data\admin-第一次的密码.txt</code></div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
